<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bug Hunter | Pixel Play</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Press+Start+2P&family=Sora:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/bughunter.css">
</head>
<body>

<header class="topo">
    <a href="jogar.html" class="nav-btn">← Voltar</a>
    <div class="nome">BUG<span>HUNTER</span></div>
    <div class="hud">
        <div>FASE <b id="fase">01/05</b></div>
        <div>BUGS <b id="bugs">0/1</b></div>
        <div>XP <b id="xp">0</b></div>
        <div>ERROS <b id="erros">0</b></div>
    </div>
</header>

<main class="jogo">
    <nav class="rede" id="rede" aria-label="Fases"></nav>

    <section class="grid">

        <article class="painel">
            <div class="barra-term">
                <span><i></i><i></i><i></i> sistema.js</span>
                <em id="estado">● INFECTADO</em>
            </div>
            <div class="editor">
                <div class="nums" id="nums" aria-hidden="true"></div>
                <textarea id="codigo" spellcheck="false" autocomplete="off" aria-label="Código para corrigir"></textarea>
            </div>
            <div class="acoes">
                <button id="b-exec" class="b-exec">▶ EXECUTAR</button>
                <button id="b-reset" class="b-sec">↻ RESETAR</button>
                <button id="b-dica" class="b-sec">💡 DICA</button>
            </div>
            <div class="saida"><span>SAÍDA DO TERMINAL</span><div id="saida">Aguardando execução...</div></div>
            <div id="mensagem" class="mensagem" aria-live="polite"></div>
        </article>

        <article class="painel">
            <span class="tag" id="tag">MISSÃO 01</span>
            <h1 id="titulo"></h1>
            <p id="desc" class="desc"></p>
            <div class="esperado"><span>SAÍDA ESPERADA</span><pre id="esperado"></pre></div>
            <div class="arena" id="arena" aria-hidden="true"></div>
            <ul class="lista" id="lista"></ul>
            <div id="hint-box" class="hint" hidden></div>
            <div class="conceito"><strong id="c-titulo"></strong><p id="c-texto"></p></div>
        </article>

    </section>
</main>

<div class="overlay" id="modal" hidden><div class="modal" id="modal-corpo"></div></div>

<script src="assets/js/bughunter.js"></script>
</body>
</html>
